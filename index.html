<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HARRY — Voice Assistant</title>
  <meta name="description" content="HARRY is a voice-first AI personal assistant...">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="app-container">
    <!-- Mobile menu toggle -->
    <button class="menu-toggle" id="menuToggle">☰</button>
    
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h1 class="gradient-text">HARRY</h1>
        <p class="subtitle">Voice Assistant</p>
      </div>
      
      <div class="sidebar-tabs">
        <button class="tab-btn active" data-tab="chats">💬 Chats</button>
        <button class="tab-btn" data-tab="notes">📝 Notes</button>
        <button class="tab-btn" data-tab="tasks">✅ Tasks</button>
        <button class="tab-btn" data-tab="settings">⚙️ Settings</button>
      </div>

      <!-- Tab: Chats -->
      <div class="sidebar-content tab-content active" id="tab-chats">
        <button class="new-btn" id="newChatBtn">+ New Chat</button>
        <div class="conversation-list" id="conversationList"></div>
      </div>

      <!-- Tab: Notes -->
      <div class="sidebar-content tab-content" id="tab-notes">
        <button class="new-btn" id="newNoteBtn">+ New Note</button>
        <input type="text" class="search-input" id="noteSearch" placeholder="Search notes...">
        <div class="notes-list" id="notesList"></div>
      </div>

      <!-- Tab: Tasks -->
      <div class="sidebar-content tab-content" id="tab-tasks">
        <div class="task-input-area">
          <input type="text" class="task-input" id="taskInput" placeholder="Add a task...">
          <button class="add-task-btn" id="addTaskBtn">+</button>
        </div>
        <div class="tasks-list" id="tasksList"></div>
      </div>

      <!-- Tab: Settings -->
      <div class="sidebar-content tab-content" id="tab-settings">
        <div class="settings-group">
          <h3>Voice</h3>
          <div class="setting-item">
            <span>Voice Response</span>
            <label class="toggle"><input type="checkbox" id="voiceToggle" checked><span class="toggle-slider"></span></label>
          </div>
          <div class="setting-item">
            <span>Auto-Listen</span>
            <label class="toggle"><input type="checkbox" id="autoListenToggle"><span class="toggle-slider"></span></label>
          </div>
          <div class="setting-item">
            <span>Language</span>
            <select id="voiceLangSelect" class="search-input" style="width: auto; margin-bottom: 0; padding: 4px 8px; background: rgba(0,0,0,0.5);">
              <option value="en-US">English</option>
              <option value="ur-PK">Urdu (اردو)</option>
            </select>
          </div>
        </div>
        <div class="settings-group">
          <h3>Memory</h3>
          <div id="memoryList"></div>
          <button class="danger-btn" id="clearMemoryBtn">Clear All Memory</button>
        </div>
      </div>
    </aside>

    <!-- Main Area -->
    <main class="main-area">
      <div class="chat-header" id="chatHeader">
        <h2 id="chatTitle">New Chat</h2>
      </div>

      <div class="chat-messages" id="chatMessages">
        <!-- Welcome screen shown when no messages -->
        <div class="welcome-screen" id="welcomeScreen">
          <div class="welcome-icon">🎙️</div>
          <h2 class="gradient-text">Hello, I'm Harry</h2>
          <p>Your voice-first AI assistant. Press the microphone or type a message to start.</p>
        </div>
      </div>

      <!-- Voice Section -->
      <div class="voice-section">
        <div class="waveform" id="waveform">
          <!-- 5 waveform bars -->
          <div class="waveform-bar"></div>
          <div class="waveform-bar"></div>
          <div class="waveform-bar"></div>
          <div class="waveform-bar"></div>
          <div class="waveform-bar"></div>
        </div>
        <button class="mic-btn" id="micBtn" title="Push to talk">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="8" y1="23" x2="16" y2="23"></line>
          </svg>
        </button>
        <span class="voice-status" id="voiceStatus">Click to speak</span>
      </div>

      <!-- Chat Input -->
      <div class="chat-input-area">
        <div class="chat-input-container">
          <label class="file-upload-btn" id="fileUploadBtn" title="Upload file">
            <input type="file" id="fileInput" accept=".txt,.pdf,.docx,.json,.csv" hidden>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
          </label>
          <input type="text" class="chat-input" id="chatInput" placeholder="Type a message..." autocomplete="off">
          <button class="send-btn" id="sendBtn" title="Send message">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          </button>
        </div>
      </div>
    </main>
  </div>

  <!-- Note Modal -->
  <div class="modal-overlay" id="noteModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="noteModalTitle">New Note</h3>
        <button class="modal-close" id="noteModalClose">&times;</button>
      </div>
      <div class="modal-body">
        <input type="text" id="noteTitleInput" placeholder="Note title..." class="modal-input">
        <textarea id="noteContentInput" placeholder="Write your note..." class="modal-textarea" rows="6"></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" id="noteModalCancel">Cancel</button>
        <button class="btn-primary" id="noteModalSave">Save</button>
      </div>
    </div>
  </div>

  <!-- File Upload Modal -->
  <div class="modal-overlay" id="fileModal">
    <div class="modal">
      <div class="modal-header">
        <h3>File Uploaded</h3>
        <button class="modal-close" id="fileModalClose">&times;</button>
      </div>
      <div class="modal-body">
        <p id="fileName"></p>
        <div class="file-actions">
          <button class="btn-primary" id="fileSummarize">Summarize</button>
          <button class="btn-secondary" id="fileAsk">Ask about it</button>
        </div>
        <div id="fileContent" class="file-content-preview"></div>
      </div>
    </div>
  </div>

  <script src="/static/js/voice.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
